version: "1.0.0"

metadata:
  feature_id: "orchestra-phase-1-cli"
  title: "Orchestra CLI - Phase 1 Implementation"
  description: "Build the Orchestra CLI tool using Orchestra to track progress (dogfooding)"
  created_at: "2025-12-01T16:00:00Z"
  target_files:
    - "src/core/**/*.ts"
    - "src/cli/**/*.ts"
    - "test/**/*.ts"

tasks:
  - id: "1.1"
    title: "Project Setup"
    description: "Initialize TypeScript project with package.json, tsconfig, build tools"
    status: "completed"
    depends_on: []
    acceptance_criteria:
      - "package.json exists with all dependencies"
      - "tsconfig.json configured for strict TypeScript"
      - "tsup.config.ts for build"
      - "vitest.config.ts for testing"
      - "npm install succeeds"
    notes: "Completed during initial scaffolding session"

  - id: "1.2"
    title: "Core Libraries"
    description: "Implement core library modules: errors, types, YAML, config, manifest, progress, output"
    status: "in-progress"
    depends_on: ["1.1"]
    acceptance_criteria:
      - "All modules compile without TypeScript errors"
      - "Zod schemas validate sample data correctly"
      - "YAML read/write works with nested structures"
      - "Error types have proper inheritance chain"
      - "Config can be loaded from nested directories"
      - "Manifest CRUD operations work correctly"
      - "Progress entries are timestamped correctly"
      - "Output formatting is consistent and readable"
      - "Unit tests pass for all modules"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.2-core-libraries.md"

  - id: "1.3"
    title: "Status Command"
    description: "Implement 'orchestra status' command with progress display"
    status: "not-started"
    depends_on: ["1.2"]
    acceptance_criteria:
      - "orchestra status shows sprint overview with progress bar"
      - "orchestra status --brief shows one-line summary"
      - "orchestra status --task TASK-001 shows task details"
      - "orchestra status --metrics shows sprint metrics"
      - "orchestra status --history shows full task history"
      - "orchestra status --json outputs valid JSON"
      - "Command exits with code 1 if not initialized"
      - "Command exits with code 2 if task not found"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.3-status-command.md"

  - id: "1.4"
    title: "Init Command"
    description: "Implement 'orchestra init' command to initialize a new sprint"
    status: "not-started"
    depends_on: ["1.2"]
    acceptance_criteria:
      - "orchestra init creates .orchestra directory structure"
      - "orchestra init --spec <file> parses spec into manifest"
      - "orchestra init --template <name> uses predefined templates"
      - "Existing .orchestra is not overwritten without --force"
      - "Config file created with sensible defaults"
      - "Exit code 0 on success, 1 on error"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.4-init-command.md"

  - id: "1.5"
    title: "Prepare Command"
    description: "Implement 'orchestra prepare' command for task handover generation"
    status: "not-started"
    depends_on: ["1.2"]
    acceptance_criteria:
      - "orchestra prepare generates current-task.md from template"
      - "orchestra prepare --task <id> prepares specific task"
      - "Template variables are substituted correctly"
      - "Handover includes task context and acceptance criteria"
      - "Previous task must be completed (or --force)"
      - "Exit code 0 on success, 1 on error"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.5-prepare-command.md"

  - id: "1.6"
    title: "Verify Command"
    description: "Implement 'orchestra verify' command to run verification checks"
    status: "not-started"
    depends_on: ["1.2"]
    acceptance_criteria:
      - "orchestra verify runs all checks for current task"
      - "orchestra verify --task <id> verifies specific task"
      - "Verification criteria loaded from verification/*.yaml"
      - "file_exists check works correctly"
      - "command check executes and validates exit code"
      - "test_count check validates minimum test count"
      - "pattern_match check validates file content"
      - "Exit code 0 if all pass, 3 if any fail"
      - "JSON output option for parsing"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.6-verify-command.md"

  - id: "1.7"
    title: "Complete Command"
    description: "Implement 'orchestra complete' command to finish tasks"
    status: "not-started"
    depends_on: ["1.6"]
    acceptance_criteria:
      - "orchestra complete marks current task as completed"
      - "Verification runs automatically before completion"
      - "Progress.yaml updated with completion entry"
      - "Git commit created with task info (if enabled)"
      - "Next task auto-prepared (if available)"
      - "Exit code 0 on success, 3 if verification fails"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.7-complete-command.md"

  - id: "1.8"
    title: "Integration Testing"
    description: "End-to-end workflow tests for CLI commands"
    status: "not-started"
    depends_on: ["1.3", "1.4", "1.5", "1.6", "1.7"]
    acceptance_criteria:
      - "E2E test: init → prepare → verify → complete cycle"
      - "Test isolation with temp directories"
      - "Tests cover happy path and error cases"
      - "Tests run on CI (exit codes work)"
      - "Coverage meets minimum threshold (80%)"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.8-integration-testing.md"

  - id: "1.9"
    title: "Documentation"
    description: "README, command reference, and usage guides"
    status: "not-started"
    depends_on: ["1.8"]
    acceptance_criteria:
      - "README.md has installation instructions"
      - "All commands documented with examples"
      - "Quick start guide for new users"
      - "Configuration reference documented"
      - "Contributing guide for developers"
    spec_file: "spec/implementation/phase-1-cli/tasks/1.9-documentation.md"
