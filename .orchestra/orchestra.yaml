version: "1.0.0"
orchestra_dir: ".orchestra"

paths:
  manifest: ".orchestra/manifest.yaml"
  progress: ".orchestra/progress.yaml"
  verification: ".orchestra/verification"
  handover: ".orchestra/handover"
  templates: ".orchestra/templates"

verification:
  run_before_complete: true
  fail_on_blocking: true

git:
  auto_commit: false
  commit_prefix: "orchestra"

defaults:
  agent: "claude-opus-4"
  max_attempts: 3
