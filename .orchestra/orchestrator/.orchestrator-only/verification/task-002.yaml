## Verification Checks

### BLOCKING (Must Pass)

| ID | Check | Command/Method | Expected |
|----|-------|----------------|----------|
| V2.1 | TypeScript compiles | `npm run build` | Exit code 0 |
| V2.2 | All tests pass | `npm test` | Exit code 0, no failures |
| V2.3 | types.ts exports Zod schemas | `grep "z\." src/core/types.ts` | Contains Zod schema definitions |
| V2.4 | errors.ts has OrchestraError | `grep "class OrchestraError" src/core/errors.ts` | Class exists |
| V2.5 | No commander imports in core | `grep -r "commander" src/core/` | No matches |
| V2.6 | index.ts exports all modules | Read `src/core/index.ts` | Re-exports errors, types, yaml, config, manifest, progress, output |

### MAJOR (Should Pass)

| ID | Check | Command/Method | Expected |
|----|-------|----------------|----------|
| V2.7 | yaml.ts has readYaml | `grep "readYaml" src/core/yaml.ts` | Function exported |
| V2.8 | yaml.ts has writeYaml | `grep "writeYaml" src/core/yaml.ts` | Function exported |
| V2.9 | config.ts finds orchestra root | `grep "findOrchestraRoot" src/core/config.ts` | Function exists |
| V2.10 | manifest.ts has loadManifest | `grep "loadManifest" src/core/manifest.ts` | Function exported |
| V2.11 | manifest.ts has saveManifest | `grep "saveManifest" src/core/manifest.ts` | Function exported |
| V2.12 | progress.ts tracks entries | `grep "addProgressEntry" src/core/progress.ts` | Function exists |
| V2.13 | output.ts uses chalk | `grep "chalk" src/core/output.ts` | Import present |

### MINOR (Nice to Have)

| ID | Check | Command/Method | Expected |
|----|-------|----------------|----------|
| V2.14 | Error hierarchy exists | Check for ConfigurationError, ManifestError, TaskError, FileError | Classes exist |
| V2.15 | Test files exist | Check `test/core/*.test.ts` | At least 3 test files |
| V2.16 | Schemas use z.infer | `grep "z.infer" src/core/types.ts` | Type inference used |

## Decision Criteria

- **PASS**: All BLOCKING checks pass, majority of MAJOR checks pass
- **FAIL**: Any BLOCKING check fails
- **NEEDS_WORK**: BLOCKING pass but multiple MAJOR fail

## Notes

- The spec file provides complete implementation code - check if implementor followed it
- Focus on API surface area, not internal implementation details
- Allow minor deviations if they achieve the same functionality
