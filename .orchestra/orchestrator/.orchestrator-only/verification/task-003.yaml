notes: |
  This is an INFRASTRUCTURE task - no screenshot required.
  
  The status command is read-only and should:
  - Execute quickly (<100ms for reasonable manifest sizes)
  - Never modify any state
  - Support multiple output formats (human, brief, JSON)
  - Handle missing/invalid data gracefully
  
  Key verification points:
  1. Uses core library (no direct file I/O in command)
  2. Proper exit codes (0=success, 1=not initialized, 2=not found)
  3. JSON output is valid and parseable
  4. Brief output is truly one line
  5. All options work independently and in combination
