# Hidden Verification Criteria for Task 1
# ORCHESTRATOR ONLY - Never expose to Implementor
# Created: 2025-12-08

task_id: 1
title: "Setup Dependencies and Project Structure"
speckit_tasks: ["T001", "T002", "T003", "T004", "T005"]

# Verification criteria - these are checked programmatically or manually
criteria:
  - id: VC-001
    description: "@modelcontextprotocol/sdk dependency is in package.json"
    type: FILE_CONTENT
    file: package.json
    check: |
      Verify package.json contains:
      "dependencies": {
        "@modelcontextprotocol/sdk": "^0.6.0"
      }
      MUST be in "dependencies", NOT "devDependencies"
    weight: critical
    automated: true

  - id: VC-002
    description: "src/mcp/ directory structure exists"
    type: DIRECTORY_EXISTS
    paths:
      - src/mcp/
      - src/mcp/tools/
    weight: critical
    automated: true

  - id: VC-003
    description: "test/mcp/ directory structure exists"
    type: DIRECTORY_EXISTS
    paths:
      - test/mcp/
      - test/mcp/tools/
    weight: critical
    automated: true

  - id: VC-004
    description: "RoleError class exists with correct implementation"
    type: FILE_CONTENT
    file: src/core/errors.ts
    check: |
      Must contain:
      1. Class declaration: export class RoleError extends OrchestraError
      2. Constructor that calls super with code "ROLE_ERROR"
      3. Sets this.name = "RoleError"
      4. Accepts optional context parameter
    weight: critical
    automated: true

  - id: VC-005
    description: "RoleSchema is correctly defined"
    type: FILE_CONTENT
    file: src/core/types.ts
    check: |
      Must contain:
      1. export const RoleSchema = z.enum(["implementor", "orchestrator"])
      2. export type Role = z.infer<typeof RoleSchema>
      
      CRITICAL: Values must be exactly "implementor" and "orchestrator" (lowercase)
      NOT "Implementor", "Orchestrator", "IMPLEMENTOR", etc.
    weight: critical
    automated: true

  - id: VC-006
    description: "AttemptTrackerSchema is correctly defined"
    type: FILE_CONTENT
    file: src/core/types.ts
    check: |
      Must contain AttemptTrackerSchema with fields:
      1. taskId: z.number() - positive integer
      2. attempts: z.number() - with default(0)
      3. lastAttemptAt: z.string().datetime() - ISO format
      4. maxAttempts: z.number() - with default(3)
      
      Must export: export type AttemptTracker = z.output<typeof AttemptTrackerSchema>
      NOT z.infer - must use z.output because of defaults
    weight: critical
    automated: true

  - id: VC-007
    description: "Exports are correct in index.ts"
    type: FILE_CONTENT
    file: src/core/index.ts
    check: |
      Must export:
      - RoleError (from errors.ts)
      - RoleSchema (from types.ts)
      - Role (type)
      - AttemptTrackerSchema (from types.ts)
      - AttemptTracker (type)
    weight: critical
    automated: true

  - id: VC-008
    description: "TypeScript compiles without errors"
    type: COMMAND
    command: npx tsc --noEmit
    expected_exit_code: 0
    weight: critical
    automated: true

  - id: VC-009
    description: "All existing tests pass"
    type: COMMAND
    command: npm test
    expected_exit_code: 0
    weight: critical
    automated: true

  - id: VC-010
    description: "Lint passes"
    type: COMMAND
    command: npm run lint
    expected_exit_code: 0
    weight: critical
    automated: true

  - id: VC-011
    description: "npm install succeeds with new dependency"
    type: COMMAND
    command: npm install
    expected_exit_code: 0
    weight: critical
    automated: true

# Edge cases to verify
edge_cases:
  - id: EC-001
    description: "RoleSchema rejects invalid roles"
    test: |
      RoleSchema.parse("admin") should throw ZodError
      RoleSchema.parse("IMPLEMENTOR") should throw ZodError (case-sensitive)
      RoleSchema.parse("") should throw ZodError
    
  - id: EC-002
    description: "AttemptTrackerSchema applies defaults"
    test: |
      AttemptTrackerSchema.parse({taskId: 1, lastAttemptAt: "2025-12-08T10:00:00Z"})
      Should result in: attempts=0, maxAttempts=3

  - id: EC-003
    description: "RoleError has correct code"
    test: |
      new RoleError("test").code should equal "ROLE_ERROR"

# Quality gates (must ALL pass)
quality_gates:
  - Build passes: npm run build
  - Types check: npx tsc --noEmit
  - Tests pass: npm test
  - Lint passes: npm run lint

# Things implementor might try to skip (watch for these)
watch_points:
  - Using devDependencies instead of dependencies for SDK
  - Using z.infer instead of z.output for AttemptTrackerSchema
  - Using wrong case for role values ("Implementor" instead of "implementor")
  - Forgetting to export types from index.ts
  - Not running npm install after adding dependency
  - Creating only src/mcp/ but not test/mcp/
