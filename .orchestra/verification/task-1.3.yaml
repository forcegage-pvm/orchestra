# Verification criteria for Task 1.3: Status Command

task_id: "1.3"
description: "Status command verification"

checks:
  - id: "status-file-exists"
    description: "src/cli/commands/status.ts exists"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "src/cli/commands/status.ts"

  - id: "status-registered"
    description: "Status command registered in CLI"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/index.ts"
      pattern: "status"

  - id: "status-command-runs"
    description: "orchestra status --help runs without error"
    type: "command"
    severity: "blocking"
    params:
      command: "npx tsx src/cli/index.ts status --help"
      expected_exit_code: 0

  - id: "status-brief-flag"
    description: "Status has --brief flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/status.ts"
      pattern: "--brief"

  - id: "status-json-flag"
    description: "Status has --json flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/status.ts"
      pattern: "--json"

  - id: "status-tests-exist"
    description: "Status command tests exist"
    type: "file_exists"
    severity: "major"
    params:
      path: "test/cli/status.test.ts"

  - id: "status-tests-pass"
    description: "Status command tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/cli/status.test.ts"
      expected_exit_code: 0
