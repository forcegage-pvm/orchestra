# Verification criteria for Task 1.4: Init Command

task_id: "1.4"
description: "Init command verification"

checks:
  - id: "init-file-exists"
    description: "src/cli/commands/init.ts exists"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "src/cli/commands/init.ts"

  - id: "init-registered"
    description: "Init command registered in CLI"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/index.ts"
      pattern: "init"

  - id: "init-command-runs"
    description: "orchestra init --help runs without error"
    type: "command"
    severity: "blocking"
    params:
      command: "npx tsx src/cli/index.ts init --help"
      expected_exit_code: 0

  - id: "init-creates-orchestra-dir"
    description: "Init creates .orchestra directory"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/commands/init.ts"
      pattern: ".orchestra"

  - id: "init-spec-flag"
    description: "Init has --spec flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/init.ts"
      pattern: "--spec"

  - id: "init-force-flag"
    description: "Init has --force flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/init.ts"
      pattern: "--force"

  - id: "init-tests-exist"
    description: "Init command tests exist"
    type: "file_exists"
    severity: "major"
    params:
      path: "test/cli/init.test.ts"

  - id: "init-tests-pass"
    description: "Init command tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/cli/init.test.ts"
      expected_exit_code: 0
