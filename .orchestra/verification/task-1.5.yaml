# Verification criteria for Task 1.5: Prepare Command

task_id: "1.5"
description: "Prepare command verification"

checks:
  - id: "prepare-file-exists"
    description: "src/cli/commands/prepare.ts exists"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "src/cli/commands/prepare.ts"

  - id: "prepare-registered"
    description: "Prepare command registered in CLI"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/index.ts"
      pattern: "prepare"

  - id: "prepare-command-runs"
    description: "orchestra prepare --help runs without error"
    type: "command"
    severity: "blocking"
    params:
      command: "npx tsx src/cli/index.ts prepare --help"
      expected_exit_code: 0

  - id: "prepare-uses-templates"
    description: "Prepare uses template rendering"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/commands/prepare.ts"
      pattern: "template|handlebars|render"

  - id: "prepare-task-flag"
    description: "Prepare has --task flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/prepare.ts"
      pattern: "--task"

  - id: "templates-exist"
    description: "At least one handover template exists"
    type: "file_exists"
    severity: "major"
    params:
      path: "templates/default.md.hbs"

  - id: "prepare-tests-exist"
    description: "Prepare command tests exist"
    type: "file_exists"
    severity: "major"
    params:
      path: "test/cli/prepare.test.ts"

  - id: "prepare-tests-pass"
    description: "Prepare command tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/cli/prepare.test.ts"
      expected_exit_code: 0
