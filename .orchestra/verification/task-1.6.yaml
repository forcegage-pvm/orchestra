# Verification criteria for Task 1.6: Verify Command

task_id: "1.6"
description: "Verify command verification"

checks:
  - id: "verify-file-exists"
    description: "src/cli/commands/verify.ts exists"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "src/cli/commands/verify.ts"

  - id: "verify-registered"
    description: "Verify command registered in CLI"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/index.ts"
      pattern: "verify"

  - id: "verify-command-runs"
    description: "orchestra verify --help runs without error"
    type: "command"
    severity: "blocking"
    params:
      command: "npx tsx src/cli/index.ts verify --help"
      expected_exit_code: 0

  - id: "verification-engine-implemented"
    description: "src/core/verification.ts has real implementation"
    type: "pattern_match"
    severity: "blocking"
    params:
      path: "src/core/verification.ts"
      pattern: "verifyTask|runVerification"
      inverse_pattern: "throw new Error\\('Not implemented'\\)"

  - id: "file-exists-check"
    description: "Verification supports file_exists check type"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/core/verification.ts"
      pattern: "file_exists|fileExists"

  - id: "command-check"
    description: "Verification supports command check type"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/core/verification.ts"
      pattern: "execSync|spawn|exec"

  - id: "verify-json-flag"
    description: "Verify has --json flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/verify.ts"
      pattern: "--json"

  - id: "verify-tests-exist"
    description: "Verify command tests exist"
    type: "file_exists"
    severity: "major"
    params:
      path: "test/cli/verify.test.ts"

  - id: "verify-tests-pass"
    description: "Verify command tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/cli/verify.test.ts"
      expected_exit_code: 0
