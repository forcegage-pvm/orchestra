# Verification criteria for Task 1.7: Complete Command

task_id: "1.7"
description: "Complete command verification"

checks:
  - id: "complete-file-exists"
    description: "src/cli/commands/complete.ts exists"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "src/cli/commands/complete.ts"

  - id: "complete-registered"
    description: "Complete command registered in CLI"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/index.ts"
      pattern: "complete"

  - id: "complete-command-runs"
    description: "orchestra complete --help runs without error"
    type: "command"
    severity: "blocking"
    params:
      command: "npx tsx src/cli/index.ts complete --help"
      expected_exit_code: 0

  - id: "complete-updates-progress"
    description: "Complete updates progress.yaml"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/commands/complete.ts"
      pattern: "saveProgress|updateProgress|progress"

  - id: "complete-runs-verification"
    description: "Complete runs verification before completing"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "src/cli/commands/complete.ts"
      pattern: "verify|verification"

  - id: "complete-message-flag"
    description: "Complete has --message flag"
    type: "file_contains"
    severity: "major"
    params:
      path: "src/cli/commands/complete.ts"
      pattern: "--message"

  - id: "complete-skip-verify-flag"
    description: "Complete has --skip-verify flag"
    type: "file_contains"
    severity: "minor"
    params:
      path: "src/cli/commands/complete.ts"
      pattern: "--skip-verify"

  - id: "complete-tests-exist"
    description: "Complete command tests exist"
    type: "file_exists"
    severity: "major"
    params:
      path: "test/cli/complete.test.ts"

  - id: "complete-tests-pass"
    description: "Complete command tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/cli/complete.test.ts"
      expected_exit_code: 0
