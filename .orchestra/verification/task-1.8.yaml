# Verification criteria for Task 1.8: Integration Testing

task_id: "1.8"
description: "Integration testing verification"

checks:
  - id: "integration-tests-exist"
    description: "Integration test files exist"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "test/integration/workflow.test.ts"

  - id: "e2e-init-test"
    description: "E2E test covers init command"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "test/integration/workflow.test.ts"
      pattern: "init"

  - id: "e2e-prepare-test"
    description: "E2E test covers prepare command"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "test/integration/workflow.test.ts"
      pattern: "prepare"

  - id: "e2e-verify-test"
    description: "E2E test covers verify command"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "test/integration/workflow.test.ts"
      pattern: "verify"

  - id: "e2e-complete-test"
    description: "E2E test covers complete command"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "test/integration/workflow.test.ts"
      pattern: "complete"

  - id: "test-isolation"
    description: "Tests use temp directories for isolation"
    type: "file_contains"
    severity: "major"
    params:
      path: "test/integration/workflow.test.ts"
      pattern: "tmp|temp|mkdtemp"

  - id: "integration-tests-pass"
    description: "All integration tests pass"
    type: "command"
    severity: "blocking"
    params:
      command: "npm test -- test/integration/"
      expected_exit_code: 0

  - id: "coverage-threshold"
    description: "Test coverage meets 80% threshold"
    type: "command"
    severity: "major"
    params:
      command: "npm run test:coverage"
      expected_exit_code: 0
