# Verification criteria for Task 1.9: Documentation

task_id: "1.9"
description: "Documentation verification"

checks:
  - id: "readme-exists"
    description: "README.md exists with content"
    type: "file_exists"
    severity: "blocking"
    params:
      path: "README.md"

  - id: "readme-installation"
    description: "README has installation instructions"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "README.md"
      pattern: "install|Installation"

  - id: "readme-usage"
    description: "README has usage examples"
    type: "file_contains"
    severity: "blocking"
    params:
      path: "README.md"
      pattern: "usage|Usage|orchestra "

  - id: "readme-commands"
    description: "README documents all commands"
    type: "file_contains"
    severity: "major"
    params:
      path: "README.md"
      pattern: "status|init|prepare|verify|complete"

  - id: "config-docs"
    description: "Configuration documented"
    type: "file_contains"
    severity: "major"
    params:
      path: "README.md"
      pattern: "config|Configuration|orchestra.yaml"

  - id: "quickstart-exists"
    description: "Quick start section exists"
    type: "file_contains"
    severity: "minor"
    params:
      path: "README.md"
      pattern: "Quick Start|Quickstart|Getting Started"

  - id: "api-docs"
    description: "Core API documentation exists"
    type: "file_exists"
    severity: "minor"
    params:
      path: "docs/api.md"
